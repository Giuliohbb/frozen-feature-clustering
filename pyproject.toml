[project]
name = "ffc"
version = "0.1.0"
description = "Representation, dimensionality reduction or algorithm? A controlled study of clustering on frozen pretrained features."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Giulio Henrique Borges Basso" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.6",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Heavy dependencies needed only to download datasets and extract features (GPU recommended).
features = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "pillow>=10",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
ffc = "ffc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffc"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]
ignore = ["N803", "N806"]  # allow X, X_red etc. (ML naming convention)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: tests that take more than a few seconds"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/ffc"]
